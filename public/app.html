  :`<div class="qa"><button onclick="fl=1;go('orders')">${ic(I.truck,24)}قيد التنفيذ</button><button onclick="fl=3;go('orders')">${ic(I.clock,24)}المؤجلة</button><button onclick="go('acc')">${ic(I.wallet,24)}كشفي</button></div>`;
 const rec=c?O.slice(0,5):act.slice(0,5);
 return hero+qa+`<div class="kp">${c?K('طلبات اليوم',O.filter(o=>o.date==t).length)+K('قيد الانتظار',cnt(0))+K('قيد التنفيذ',cnt(1))+K('سُلّمت اليوم',dt.length)+K('مؤجل',cnt(3))+K('راجع',cnt(4)):K('بانتظار التنفيذ',cnt(0)+cnt(1))+K('سلّمت اليوم',dt.length)+K('تحصيل اليوم',n(sum(dt)))+K('اجورك اليوم',n(sum(dt,'fee')))+K('مؤجل',cnt(3))+K('راجع',cnt(4))}</div>`+
 `<div class="sec"><span>${c?'آخر الطلبات':'بانتظار التنفيذ'}</span><a onclick="go('orders')">عرض الكل ←</a></div>`+(rec.map(card).join('')||'<div class="em">لا توجد طلبات</div>')}

/* ===== بطاقة الطلب ===== */
const R=(l,v)=>(v===''||v==null)?'':`<div class="rw"><span>${l}</span><span>${E(v)}</span></div>`;
const tlink=o=>location.protocol.startsWith('http')?location.origin+'/track.html?no='+encodeURIComponent(o.no)+'&p='+String(o.phone||'').replace(/\D/g,'').slice(-4):'';
const find=id=>P.orders.find(x=>x.id==id);
function card(o){const c=cl(),op=openId==o.id,h=o.hist||[],lk=tlink(o);
 return `<div class="card o ${op?'open':''}" onclick="tg(${o.id})"><div class="t"><b>#${E(o.no)}</b><span class="bd s${o.status}">${ST[o.status]}</span></div><p>${E(o.cust)} — ${E(o.gov)}${o.area?' / '+E(o.area):''}</p><p>${E(o.goods||'')}${o.qty>1?' × '+o.qty:''}</p>
 <div class="m"><div>${n(o.total)} <span>د.ع</span></div><span>${o.date}</span></div>
 <div class="det" onclick="event.stopPropagation()">${R('الزبون',o.cust)}${R('الهاتف',o.phone)}${R('العنوان',o.gov+(o.area?' / '+o.area:''))}${R('البضاعة',(o.goods||'')+(o.qty>1?' × '+o.qty:''))}${R('المبلغ',n(o.total)+' د.ع')}${R(c?'الاجرة':'اجرتك',n(o.fee)+' د.ع')}${c?R('الصافي لك',n(o.total-o.fee)+' د.ع'):''}${R('ملاحظات',o.notes)}${c&&o.rep?R('المندوب',o.rep.name):''}
 ${h.length?`<ul class="tl">${h.map(x=>`<li class="s${x.s}">${ST[x.s]}<small>${fmt(x.t)}</small></li>`).join('')}</ul>`:''}
 <div class="ac">${o.phone?`<a href="tel:+${ph(o.phone)}">${ic(I.phone,16)}اتصال</a><a class="wa" target="_blank" rel="noopener" href="https://wa.me/${ph(o.phone)}?text=${encodeURIComponent('مرحباً '+o.cust+'، بخصوص طلبك رقم '+o.no+' من '+(c?P.me.name:P.co)+(lk?'\nتتبع طلبك: '+lk:''))}">${ic(I.chat,16)}واتساب</a>`:''}
 ${c&&o.rep&&o.rep.phone?`<a href="tel:+${ph(o.rep.phone)}">${ic(I.truck,16)}المندوب</a>`:''}
 ${c?'':`<a target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent((o.area||'')+' '+o.gov+' العراق')}">${ic(I.pin,16)}الخريطة</a>`}
 <button onclick="rc(${o.id})">${ic(I.file,16)}وصل</button><button onclick="cp(${o.id})">${ic(I.copy,16)}نسخ الرقم</button>
 ${c?`<button onclick="rp(${o.id})">${ic(I.repeat,16)}تكرار</button>${o.status==0?`<button onclick="ed(${o.id})">${ic(I.edit,16)}تعديل</button><button class="dg" onclick="cx(${o.id})">${ic(I.trash,16)}الغاء</button>`:''}`:''}</div>
 ${c?'':`<div class="ac">${[1,2,3,4].map(s=>`<button class="${o.status==s?'on s'+s:''}" onclick="setS(${o.id},${s})">${ST[s]}</button>`).join('')}</div>`}</div></div>`}
window.tg=id=>{openId=openId==id?0:id;draw(true)};
window.cp=id=>{const o=find(id);try{navigator.clipboard.writeText(String(o.no)).then(()=>toast('تم نسخ رقم الوصل ✓'),()=>toast(o.no))}catch(e){toast(o.no)}};

/* ===== الطلبات ===== */
const inD=o=>dfl=='all'||(dfl=='today'?o.date==today():dfl=='week'?o.date>=ld(6):o.date.slice(0,7)==today().slice(0,7));
const flt=()=>P.orders.filter(o=>(fl<0||o.status==fl)&&inD(o)&&(!q||[o.no,o.cust,o.phone,o.area,o.gov,o.goods].join(' ').includes(q)));
const olist=()=>{const L=flt();return `<div class="sec"><span>${L.length} طلب</span><a onclick="q='';fl=-1;dfl='all';draw()">${q||fl>=0||dfl!='all'?'مسح الفلاتر':''}</a></div>`+(L.map(card).join('')||'<div class="em">لا توجد طلبات مطابقة</div>')};
function vOrders(){const O=P.orders;
 return `<div class="sr">${ic(I.search,18)}<input id="qs" placeholder="بحث برقم الوصل أو الاسم أو الهاتف أو المنطقة…" value="${E(q)}" oninput="sq(this.value)"></div>
 <div class="ch">${[[-1,'الكل']].concat(ST.map((s,i)=>[i,s])).map(c=>`<button class="${fl==c[0]?'on':''}" onclick="fl=${c[0]};draw(true)">${c[1]} (${c[0]<0?O.length:O.filter(o=>o.status==c[0]).length})</button>`).join('')}</div>
 <div class="ch">${[['all','كل الفترات'],['today','اليوم'],['week','آخر 7 ايام'],['month','هذا الشهر']].map(c=>`<button class="${dfl==c[0]?'on':''}" onclick="dfl='${c[0]}';draw(true)">${c[1]}</button>`).join('')}</div><div id="ol">${olist()}</div>`}
window.sq=v=>{q=v.trim();$('#ol').innerHTML=olist()};

/* ===== اضافة / تعديل طلب + استيراد Excel ===== */
const F=(k,l,t='text',x='')=>`<div><label>${l}</label><input id="f_${k}" type="${t}" ${x} value="${E(draft[k]!=null?draft[k]:(k=='qty'?1:''))}"></div>`;
function fAdd(){const gv=draft.gov;
 return `<div class="card"><h3>${edit?'تعديل الطلب #'+E(draft.no):'اضافة طلب جديد'}</h3>${F('no','رقم الوصل','text',edit?'disabled':'')}${F('cust','اسم الزبون')}${F('phone','هاتف الزبون','tel','inputmode="tel"')}<div><label>المحافظة</label><select id="f_gov">${P.govs.map(g=>`<option ${g==gv?'selected':''}>${E(g)}</option>`).join('')}</select></div>${F('area','المنطقة')}${F('goods','نوع البضاعة')}<div class="g2">${F('qty','عدد القطع','number','inputmode="numeric"')}${F('total','المبلغ الكلي','number','inputmode="numeric"')}</div>${F('notes','ملاحظات')}<div style="height:16px"></div><button class="btn" onclick="addO()">${edit?'حفظ التعديل':'ارسال الطلب'}</button>${edit?'<div style="height:8px"></div><button class="btn" style="background:var(--bg);color:var(--tx);box-shadow:none;border:1.5px solid var(--bd)" onclick="go(\'orders\')">الغاء التعديل</button>':''}</div>`+
 (edit?'':`<div class="card" id="imp"><h3>استيراد طلبات من Excel</h3><p class="mu">حمّل القالب واملأه (رقم الوصل، الزبون، الهاتف، المحافظة، المنطقة، البضاعة، القطع، المبلغ) ثم ارفعه هنا.</p><div class="ac"><a href="client-template.xlsx" download>⬇ تنزيل القالب</a></div><label>اختر ملف Excel أو CSV</label><input type="file" accept=".xlsx,.xls,.csv" onchange="impX(this)"></div>`)}
window.addO=async()=>{const b={};['no','cust','phone','gov','area','goods','qty','total','notes'].forEach(k=>b[k]=$('#f_'+k).value);
 try{let r;if(edit){b.id=edit;r=await api('oedit','POST',b)}else r=await api('order','POST',b);if(!r.ok)return toast(r.error||'فشل');toast(edit?'تم حفظ التعديل ✓':'تم ارسال الطلب ✓');edit=0;draft={};tab='orders';fl=-1;await load()}catch(e){}};
const fill=o=>({no:o.no,cust:o.cust,phone:o.phone,gov:o.gov,area:o.area,goods:o.goods,qty:o.qty,total:o.total,notes:o.notes});
window.ed=id=>{const o=find(id);edit=id;draft=fill(o);tab='add';draw()};
window.rp=id=>{const o=find(id);edit=0;draft=Object.assign(fill(o),{no:''});tab='add';draw();toast('أدخل رقم وصل جديد')};
window.cx=async id=>{const o=find(id);if(!confirm('الغاء الطلب #'+o.no+'؟'))return;try{const r=await api('ocancel','POST',{id});if(!r.ok)return toast(r.error||'فشل');toast('تم الغاء الطلب');openId=0;load()}catch(e){}};
window.impX=async inp=>{const f=inp.files[0];if(!f)return;
 try{if(!window.XLSX)await new Promise((ok,no)=>{const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';s.onload=ok;s.onerror=()=>no(new Error('تعذر تحميل مكتبة Excel، تحقق من الاتصال'));document.head.appendChild(s)});
  const wb=XLSX.read(await f.arrayBuffer(),{type:'array'}),rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:'',raw:false});
  const g=(r,...ks)=>{for(const k of ks)if(r[k]!=null&&String(r[k]).trim()!=='')return String(r[k]).trim();return ''};
  const L=rows.map(r=>{let p=g(r,'الهاتف','هاتف الزبون','phone');if(/^7\d{9}$/.test(p))p='0'+p;return{no:g(r,'رقم الوصل','الوصل','no'),cust:g(r,'الزبون','اسم الزبون','cust'),phone:p,gov:g(r,'المحافظة','gov'),area:g(r,'المنطقة','area'),goods:g(r,'البضاعة','نوع البضاعة','goods'),qty:g(r,'القطع','عدد القطع','qty'),total:g(r,'المبلغ','المبلغ الكلي','total').replace(/,/g,''),notes:g(r,'ملاحظات','notes')}}).filter(r=>r.no||r.cust||r.total);
  if(!L.length)return toast('الملف فارغ أو العناوين لا تطابق القالب');
  if(!confirm('سيتم استيراد '+L.length+' طلب. متابعة؟'))return;
  const r=await api('obulk','POST',{rows:L});if(!r.ok)return toast(r.error||'فشل');
  alert('تم استيراد '+r.added+' طلب'+(r.skipped?'\nتم تخطي '+r.skipped+':\n'+r.errors.join('\n'):''));tab='orders';fl=-1;await load()}
 catch(e){if(e)alert(e.message||e)}finally{inp.value=''}};

/* ===== الوصل / الحالة ===== */
window.rc=id=>{const o=find(id);if(!o)return;const c=cl();printReceipt({co:P.co,no:o.no,date:o.date,status:ST[o.status],client:c?P.me.name:'',cust:o.cust,phone:o.phone,gov:o.gov,area:o.area,goods:o.goods,qty:o.qty,notes:o.notes,total:o.total,showFee:false,rep:c?(o.rep?o.rep.name:''):P.me.name,repPhone:c?(o.rep?o.rep.phone:''):(P.me.phone||''),link:tlink(o)})};
window.setS=async(id,s)=>{try{const r=await api('ostatus','POST',{id,status:s});if(!r.ok)return toast(r.error||'فشل');toast('تم تحديث الحالة ✓');load()}catch(e){}};

/* ===== حسابي + كشف ===== */
function vAcc(){const c=cl(),d=P.orders.filter(o=>o.status==2&&(!stF||dDate(o)>=stF)&&(!stT||dDate(o)<=stT)),T=sum(d),Fe=sum(d,'fee'),K=(l,v)=>`<div class="k"><small>${l}</small><b>${v}</b></div>`;
 return `<div class="kp">${K('اجمالي الطلبات',n(P.orders.length))}${K('تم التسليم',n(d.length))}${K(c?'المبالغ المسلمة':'مبلغ التحصيل',n(T))}${K(c?'اجور الشركة':'اجورك',n(Fe))}${c?K('صافي مستحقك',n(T-Fe)):''}${K('الرواجع',n(P.orders.filter(o=>o.status==4).length))}</div>
 <div class="card"><h3>كشف الحساب</h3><div class="g2"><div><label>من تاريخ</label><input type="date" value="${stF}" onchange="stF=this.value;draw(true)"></div><div><label>الى تاريخ</label><input type="date" value="${stT}" onchange="stT=this.value;draw(true)"></div></div>
 <div style="overflow:auto;margin-top:10px"><table class="stb"><tr><th>الوصل</th><th>التاريخ</th><th>المبلغ</th><th>${c?'الاجرة':'اجرتك'}</th>${c?'<th>الصافي</th>':''}</tr>${d.map(o=>`<tr><td>#${E(o.no)}</td><td>${dDate(o).slice(5)}</td><td>${n(o.total)}</td><td>${n(o.fee)}</td>${c?`<td>${n(o.total-o.fee)}</td>`:''}</tr>`).join('')||`<tr><td colspan="5" style="text-align:center;color:var(--mu)">لا توجد طلبات مسلّمة</td></tr>`}</table></div>
 <div style="height:12px"></div><button class="btn" onclick="pst()">🖨 طباعة / حفظ الكشف</button></div>
 <div class="card"><h3>تغيير كلمة المرور</h3>${F('op','كلمة المرور الحالية','password')}${F('np','كلمة المرور الجديدة (6 احرف+)','password')}<div style="height:14px"></div><button class="btn" onclick="chp()">حفظ</button></div>`}
window.pst=()=>{const d=P.orders.filter(o=>o.status==2&&(!stF||dDate(o)>=stF)&&(!stT||dDate(o)<=stT));printStatement({co:P.co,name:P.me.name,range:(stF||'البداية')+' → '+(stT||today()),rows:d.map(o=>({no:o.no,total:o.total,fee:o.fee,net:o.total-o.fee})),T:sum(d),F:sum(d,'fee')})};
window.chp=async()=>{try{const r=await api('passwd','POST',{old:$('#f_op').value,pass:$('#f_np').value});toast(r.ok?'تم تغيير كلمة المرور ✓':(r.error||'فشل'))}catch(e){}};
load();setInterval(()=>{if(tab!='add'&&!/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)&&!document.getElementById('rcpt-ov'))load()},10000);
</script></body></html>
