<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#4f46e5"><title>تتبع طلبك</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet"><style>
:root{--bg:#f4f5fb;--cd:#fff;--tx:#161a3a;--mu:#6c7597;--bd:#e7e9f4;--p:#6366f1;--p2:#06b6d4;--ok:#10b981;--sh:0 1px 2px #161a3a0d,0 12px 32px -12px #161a3a2e}
@media(prefers-color-scheme:dark){:root{--bg:#0a0d20;--cd:#141937;--tx:#e9ecfa;--mu:#8d97bd;--bd:#ffffff14;--sh:0 12px 32px -12px #0008}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;background:var(--bg);color:var(--tx);font-family:Cairo,Tahoma,sans-serif;min-height:100vh}
header{color:#fff;text-align:center;padding:calc(34px + env(safe-area-inset-top)) 20px 80px;background:radial-gradient(300px 160px at 0 100%,#06b6d4aa,transparent),radial-gradient(320px 180px at 100% 0,#a855f7aa,transparent),linear-gradient(135deg,#3730a3,#6366f1)}
header .ic{width:60px;height:60px;border-radius:20px;background:#ffffff2e;display:inline-flex;align-items:center;justify-content:center;margin-bottom:10px}header h1{margin:0;font-size:24px}header p{margin:6px 0 0;opacity:.85;font-weight:600}
main{max-width:520px;margin:-52px auto 0;padding:0 16px 40px}.card{background:var(--cd);border:1px solid var(--bd);border-radius:22px;box-shadow:var(--sh);padding:20px;margin-bottom:14px}
label{display:block;margin:12px 2px 6px;font-size:13px;font-weight:700;color:var(--mu)}label:first-child{margin-top:0}
input{width:100%;border:1.5px solid var(--bd);border-radius:14px;padding:14px;font:700 16px Cairo;background:var(--bg);color:var(--tx);outline:0;text-align:center;letter-spacing:.5px}input:focus{border-color:var(--p);box-shadow:0 0 0 4px #6366f122}
button{width:100%;margin-top:16px;border:0;border-radius:14px;padding:15px;font:800 16px Cairo;color:#fff;cursor:pointer;background:linear-gradient(135deg,var(--p),#a855f7);box-shadow:0 12px 22px -10px #6366f1cc}button:disabled{opacity:.6}
.err{margin-top:14px;padding:12px;border-radius:12px;background:#ef444418;color:#ef4444;font-weight:700;text-align:center}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.top b{font-size:20px}.bd{padding:5px 14px;border-radius:20px;font-size:13px;font-weight:800;color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent)}
.s0{--c:#f59e0b}.s1{--c:#3b82f6}.s2{--c:#10b981}.s3{--c:#8b5cf6}.s4{--c:#ef4444}
.msg{margin:14px 0 4px;font-weight:700;line-height:1.9}
.st{list-style:none;margin:18px 0 6px;padding:0}.st li{position:relative;padding:0 38px 22px 0;color:var(--mu);font-weight:700}.st li:last-child{padding-bottom:0}
.st li:before{content:"";position:absolute;right:0;top:2px;width:24px;height:24px;border-radius:50%;border:2px solid var(--bd);background:var(--cd)}
.st li:after{content:"";position:absolute;right:11px;top:28px;bottom:-2px;width:2px;background:var(--bd)}.st li:last-child:after{display:none}
.st li.on{color:var(--tx)}.st li.on:before{background:var(--ok);border-color:var(--ok);box-shadow:0 0 0 4px #10b98120}.st li.on:after{background:var(--ok)}
.st li.on:before{content:"✓";color:#fff;font-size:14px;line-height:20px;text-align:center}.st li.cur:before{background:var(--p);border-color:var(--p);box-shadow:0 0 0 5px #6366f12e}
.st small{display:block;font-weight:600;font-size:12px;margin-top:1px;color:var(--mu)}
.info{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}.info div{background:var(--bg);border-radius:14px;padding:11px 13px}.info small{display:block;color:var(--mu);font-weight:700;font-size:12px}.info b{font-size:15px}
.rep{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:14px;padding:14px;border-radius:16px;background:var(--bg)}.rep small{color:var(--mu);font-weight:700;display:block}.rep a{display:inline-flex;align-items:center;justify-content:center;border-radius:12px;padding:10px 14px;font-weight:800;font-size:14px;text-decoration:none;color:#fff;background:#16a34a;white-space:nowrap}
.again{background:none;box-shadow:none;color:var(--p);margin-top:8px}
</style></head><body>
<header><div class="ic"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M1 6h13v10H1zM14 9h4l3 3v4h-7M5.5 19a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3zM17.5 19a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3z"/></svg></div><h1>تتبع طلبك</h1><p id="co">ادخل رقم طلبك لمعرفة حالته</p></header>
<main><div class="card" id="fm"><label>رقم الطلب (الوصل)</label><input id="no" inputmode="text" autocomplete="off" placeholder="مثال: 1001" onkeydown="if(event.key=='Enter')go()">
<div id="pw" style="display:none"><label>آخر 4 ارقام من رقم هاتفك</label><input id="p4" inputmode="numeric" maxlength="4" autocomplete="off" placeholder="0000" onkeydown="if(event.key=='Enter')go()"></div>
<button id="bt" onclick="go()">بحث</button><div id="er"></div></div><div id="rs"></div></main>
<script>
const $=s=>document.querySelector(s),ST=['قيد الانتظار','قيد التنفيذ','تم التسليم','مؤجل','راجع'],
MSG=['تم استلام طلبك وهو بانتظار التجهيز.','طلبك قيد التنفيذ وفي الطريق اليك.','تم تسليم طلبك بنجاح. شكراً لثقتك بنا 🌹','تم تأجيل طلبك، سيتم التواصل معك قريباً.','تم ارجاع الطلب.'];
const E=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ph=p=>{p=String(p||'').replace(/\D/g,'');return p.startsWith('964')?p:p.replace(/^0/,'964')};
const fmt=t=>new Date(t).toLocaleString('ar-IQ',{day:'numeric',month:'short',hour:'numeric',minute:'2-digit'});
let need=false;
async function q(no,p){const r=await fetch('/api/track?no='+encodeURIComponent(no)+'&p='+encodeURIComponent(p||''));return r.json()}
async function init(){try{const r=await q('');if(r.co)$('#co').textContent=r.co;need=!!r.phone;$('#pw').style.display=need?'':'none';
 const u=new URLSearchParams(location.search);if(u.get('no')){$('#no').value=u.get('no');$('#p4').value=(u.get('p')||'').slice(-4);go()}}catch(e){}}
async function go(){const no=$('#no').value.trim(),p=$('#p4').value.trim();$('#er').innerHTML='';
 if(!no)return $('#er').innerHTML='<div class="err">ادخل رقم الطلب</div>';
 if(need&&p.length<4)return $('#er').innerHTML='<div class="err">ادخل آخر 4 ارقام من هاتفك</div>';
 $('#bt').disabled=true;try{const r=await q(no,p);
  if(r.need){need=true;$('#pw').style.display='';$('#p4').focus();$('#er').innerHTML='<div class="err">ادخل آخر 4 ارقام من هاتفك للتحقق</div>';return}
  if(!r.ok)return $('#er').innerHTML='<div class="err">'+E(r.error||'لم يتم العثور على الطلب')+'</div>';show(r)}
 catch(e){$('#er').innerHTML='<div class="err">تعذر الاتصال، حاول مرة اخرى</div>'}finally{$('#bt').disabled=false}}
function show(r){const h=r.hist||[],at=s=>{const x=h.filter(y=>y.s==s).pop();return x?fmt(x.t):''};
 const steps=[[0,'تم استلام الطلب'],[1,'في الطريق اليك']];const fin=r.status==3?[3,'مؤجل']:r.status==4?[4,'راجع']:[2,'تم التسليم'];steps.push(fin);
  const done=s=>s[0]==0||s[0]==r.status||(s[0]==1&&(r.status==2||h.some(y=>y.s==1)));
 $('#rs').innerHTML=`<div class="card"><div class="top"><b>طلب #${E(r.no)}</b><span class="bd s${r.status}">${ST[r.status]}</span></div><p class="msg">${MSG[r.status]}</p>
 <ul class="st">${steps.map(s=>{const on=done(s),cur=on&&s[0]==r.status;return`<li class="${on?'on':''} ${cur?'cur':''}">${s[1]}<small>${on?(at(s[0])||(s[0]==0?E(r.date):'')):''}</small></li>`}).join('')}</ul>
 ${r.rep?`<div class="rep"><div><small>المندوب</small><b>${E(r.rep.name)}</b>${r.rep.phone?`<small dir="ltr" style="text-align:right">${E(r.rep.phone)}</small>`:''}</div>${r.rep.phone&&r.status<2?`<a href="tel:+${ph(r.rep.phone)}">اتصال</a>`:''}</div>`:''}
 <div class="info"><div><small>التاريخ</small><b>${E(r.date)}</b></div><div><small>المحافظة</small><b>${E(r.gov)}${r.area?' / '+E(r.area):''}</b></div></div></div><button class="again" onclick="$('#rs').innerHTML='';$('#no').value='';$('#p4').value='';$('#no').focus();scrollTo(0,0)">بحث عن طلب آخر</button>`;
 $('#rs').scrollIntoView({behavior:'smooth',block:'start'})}
init();
</script></body></html>
