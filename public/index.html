 if(!o.no||!o.client||!o.cust||!o.total)throw'ادخل رقم الوصل والعميل والزبون والمبلغ';if(D.orders.some(x=>x.no==o.no&&x.client==o.client))throw'رقم الوصل مكرر';D.orders.push(o);note('🆕 طلب جديد '+o.no+' — '+o.cust+' — '+o.gov+' — '+n(o.total)+' د.ع');save();alert('تم الحفظ');go('list?pending')});

function render(){if(TK()&&['عميل','مندوب'].includes(ME().type)){location.href='app.html';return}if(!TK()){$('#app').innerHTML=`<div class="lg"><div class="lh"><div class="lgo" style="width:64px;height:64px">${ic('truck',32)}</div><h1>${D.co.name}</h1><p>منصة متكاملة لإدارة الطلبات والمندوبين والحسابات بكفاءة عالية.</p><ul><li>تتبع لحظي لحالة الطلبات</li><li>كشوفات وحسابات تلقائية</li><li>إحصائيات وتقارير ذكية</li></ul></div><div class="lf"><h2>تسجيل الدخول</h2><p>أهلاً بعودتك، اختر طريقة التشغيل ثم ادخل</p><div class="seg"><button class="${MODE()=='demo'?'on':''}" onclick="setMode('demo')">${ic('box',16)}نسخة تجريبية</button><button class="${MODE()=='server'?'on':''}" onclick="setMode('server')">${ic('wallet',16)}السيرفر</button></div><div class="hint">${MODE()=='demo'?'بيانات تجريبية محفوظة في متصفحك فقط. ادخل بالمستخدم <b>admin</b> وأي كلمة مرور.':'ادخل بحسابك المسجّل على الخادم.'}</div><div class="fl"><label>اسم المستخدم</label><div class="in">${ic('users',18)}<input id="lu" value="${MODE()=='demo'?'admin':''}" autocomplete="username" onkeydown="if(event.key=='Enter')$('#lp').focus()"></div></div><div class="fl"><label>كلمة المرور</label><div class="in">${ic('lock',18)}<input id="lp" value="${MODE()=='demo'?'demo':''}" type="password" autocomplete="current-password" onkeydown="if(event.key=='Enter')doLogin()"></div></div><button class="b" style="width:100%" onclick="doLogin()">دخول</button><p style="text-align:center;margin:16px 0 0"><a href="track.html" style="color:var(--p);font-weight:700;text-decoration:none">🔎 تتبع طلبك (للزبائن)</a></p></div></div>`;return}
 const [p,a]=(location.hash.slice(1)||'').split(/\?(.*)/);try{$('#app').innerHTML=shell((R[p]||R[''])(a||''),(location.hash.slice(1)||'').split('&')[0])}catch(e){$('#app').innerHTML=shell('<div class="bx"><h2>خطأ</h2></div>');console.error(e)}scrollTo(0,0)}
window.alert=m=>{const t=$('#ts');t.textContent=m;t.style.display='block';clearTimeout(window._t);window._t=setTimeout(()=>t.style.display='none',2600)};window.thm=()=>{document.documentElement.dataset.t=document.documentElement.dataset.t=='d'?'':'d'};

const TK=()=>{try{return localStorage.tk||''}catch(e){return ''}};
const ME=()=>{try{return JSON.parse(localStorage.me)}catch(e){return {name:'—',user:'',type:''}}};
window.api=async(p,m='GET',b)=>{if(MODE()=='demo')throw 'وضع تجريبي بدون خادم — هذه الميزة تعمل في وضع السيرفر';const r=await fetch('/api/'+p,{method:m,headers:{'Content-Type':'application/json','x-token':TK()},body:b?JSON.stringify(b):undefined});if(r.status==401&&p!='login'&&TK()){logout();throw 'انتهت الجلسة، سجّل الدخول من جديد'}return r.json()};
window.doLogin=async()=>{try{if(MODE()=='demo'){const u=D.users.find(x=>x.user==$('#lu').value.trim());if(!u)throw 'جرّب المستخدم: admin (او c1 عميل، r1 مندوب)';const me={id:u.id,name:u.name,user:u.user,type:u.type};localStorage.tk='demo';localStorage.me=JSON.stringify(me);if(['عميل','مندوب'].includes(u.type))location.href='app.html';else render();return}const r=await api('login','POST',{user:$('#lu').value.trim(),pass:$('#lp').value});if(!r.token)throw r.error||'فشل الدخول';localStorage.tk=r.token;localStorage.me=JSON.stringify(r.me);if(['عميل','مندوب'].includes(r.me.type))location.href='app.html';else{await pull();render()}}catch(e){alert(e.message||e)}};
window.setMode=m=>{if(m=='server'&&location.protocol=='file:')return alert('وضع السيرفر يعمل فقط عند فتح الموقع عبر رابط الخادم (ليس كملف من الجهاز)');localStorage.mode=m;location.reload()};
window.logout=()=>{localStorage.removeItem('tk');localStorage.removeItem('me');render()};window.out=()=>logout();
window.rpw=async i=>{const p=prompt('كلمة المرور الجديدة للمستخدم '+U(i).name+' (6 احرف على الاقل)');if(!p)return;try{const r=await api('passwd','POST',{user:U(i).user,pass:p});alert(r.ok?'تم تغيير كلمة المرور':(r.error||'فشل'))}catch(e){alert(e.message||e)}};
const ph=p=>{p=String(p||'').replace(/\D/g,'');return p.startsWith('964')?p:p.replace(/^0/,'964')};
const cw=(p,m='')=>p?`<a class="b s" href="tel:+${ph(p)}" title="اتصال">${ic('phone',15)}</a><a class="b s wa" target="_blank" rel="noopener" href="https://wa.me/${ph(p)}${m?'?text='+encodeURIComponent(m):''}" title="واتساب">${ic('chat',15)}</a>`:'';
async function pull(){if(!TK()||MODE()=='demo')return;try{const r=await api('state');if(!r.state){api('state','PUT',D);return}
 if((r.state.ts||0)>(D.ts||0)){D=r.state;try{localStorage[KEY]=JSON.stringify(D)}catch(e){}if(!/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName))render()}
 else if((r.state.ts||0)<(D.ts||0))api('state','PUT',D)}catch(e){}}
const A=f=>async(...a)=>{try{await f(...a)}catch(e){alert(e.message||e)}};

const WAP={ultramsg:'UltraMsg',whapi:'Whapi.Cloud',meta:'Meta WhatsApp Cloud API',custom:'مخصص (أي مزوّد API)'};
R.wa=()=>{setTimeout(waLoad,50);const ev=['new','assigned','onway','delivered','postponed','returned'];
 return box('ربط واتساب (ارسال الرسائل للزبائن)',`<div class="g"><div>الحالة<b id="was">…</b></div><div>رابط التتبع<b id="wal" style="font-size:13px;word-break:break-all">…</b></div></div>`+fld('won','ارسال الرسائل تلقائياً','s',[[0,'متوقف'],[1,'مفعّل']])+fld('wp','مزوّد واتساب API','s',Object.entries(WAP))+
 `<div class="pv" data-p="ultramsg">${fld('wi','Instance ID (مثال instance12345)')}</div><div class="pv" data-p="meta">${fld('wph','Phone Number ID')}</div>`+
 `<div class="pv" data-p="custom">${fld('wu','رابط API (يدعم {{phone}} و {{message}})')}${fld('wm','الطريقة','s',['POST','GET'])}${fld('wh','Headers (JSON) مثال: {"Authorization":"Bearer ..."}','a')}${fld('wb','قالب Body (اتركه فارغاً للافتراضي {"phone":"{{phone}}","message":"{{message}}"})','a')}</div>`+
 fld('wt','Token / API Key (يُحفظ على الخادم ولا يظهر)','p')+fld('wbs','رابط الموقع للتتبع (اختياري، مثال https://example.com)')+fld('wtp','التحقق في صفحة التتبع','s',[[1,'رقم الطلب + آخر 4 ارقام (آمن)'],[0,'رقم الطلب فقط']])+
 `<button class="b" onclick="waSave()">${ic('check',18)}حفظ الاعدادات</button>`)+
 box('اختبار الارسال',fld('wtn','رقم واتساب للتجربة (مثال 0770xxxxxxx)')+`<button class="b o" onclick="waTest()">${ic('send',17)}ارسال رسالة تجريبية</button>`)+
 box('قوالب الرسائل (تُرسل لهاتف الزبون)','<p style="margin:0 0 12px;line-height:2">المتغيرات: <code>{customer}</code> الزبون · <code>{order_no}</code> رقم الطلب · <code>{rep_name}</code> اسم المندوب · <code>{rep_phone}</code> رقم المندوب · <code>{client}</code> العميل · <code>{gov}</code> <code>{area}</code> · <code>{goods}</code> <code>{qty}</code> · <code>{total}</code> المبلغ · <code>{status}</code> · <code>{date}</code> · <code>{track_link}</code> رابط التتبع · <code>{company}</code></p>'+ev.map(k=>`<div id="wev_${k}">${fld('wo_'+k,'','s',[[1,'مفعّل'],[0,'متوقف']])}${fld('wx_'+k,'','a')}</div>`).join('')+`<button class="b" onclick="waSave()">${ic('check',18)}حفظ القوالب</button>`)+
 box('سجل الرسائل (آخر 60)','<div id="wlog"></div><button class="b s" onclick="waClear()">مسح السجل</button>')};
const WAL={new:'طلب جديد',assigned:'تسليم للمندوب',onway:'في الطريق',delivered:'تم التسليم',postponed:'مؤجل',returned:'راجع',test:'تجريبية'};
const waShow=()=>{const p=val('wp');document.querySelectorAll('.pv').forEach(e=>e.style.display=e.dataset.p==p?'':'none')};
window.waLoad=async()=>{const s=$('#was');if(!s)return;try{const r=await api('wa');if(r.error)throw r.error;
 $('#f_won').value=r.on;$('#f_wp').value=r.provider;$('#f_wi').value=r.instance||'';$('#f_wph').value=r.phoneId||'';$('#f_wu').value=r.url||'';$('#f_wm').value=r.method||'POST';$('#f_wh').value=r.headers||'';$('#f_wb').value=r.bodyTpl||'';$('#f_wbs').value=r.base||'';$('#f_wtp').value=r.trackPhone;
 $('#f_wt').placeholder=r.set?r.mask:'الصق التوكن هنا';$('#f_wp').onchange=waShow;waShow();
 s.textContent=(r.on?'مفعّل':'متوقف')+' — '+(r.set?'التوكن محفوظ ✓':'بدون توكن');$('#wal').textContent=r.eff+'/track.html';
 Object.entries(r.events).forEach(([k,e])=>{const w=$('#wev_'+k);w.querySelector('.fl label').textContent=e.label;w.querySelectorAll('.fl label')[1].textContent='نص الرسالة — '+e.label;$('#f_wo_'+k).value=e.on;$('#f_wx_'+k).value=e.text});
 $('#wlog').innerHTML=r.log.length?`<div class="tw"><table><tr><th>الوقت</th><th>الطلب</th><th>الحدث</th><th>الى</th><th>النتيجة</th></tr>${r.log.map(l=>`<tr><td>${new Date(l.t).toLocaleString('ar-IQ')}</td><td>${l.no}</td><td>${WAL[l.ev]||l.ev}</td><td>${l.to}</td><td>${l.ok?'✓ تم':'✗ '+l.err}</td></tr>`).join('')}</table></div>`:'<p style="color:var(--mu)">لا توجد رسائل بعد</p>'}catch(e){s.textContent='الخادم غير متصل'}};
window.waSave=A(async()=>{const events={};['new','assigned','onway','delivered','postponed','returned'].forEach(k=>events[k]={on:+val('wo_'+k),text:val('wx_'+k)});

 alert(r.ok?'تم الحفظ':(r.error||'فشل الحفظ'));$('#f_wt').value='';waLoad()});
window.waTest=A(async()=>{const r=await api('wa-test','POST',{phone:val('wtn')});alert(r.ok?'تم ارسال الرسالة التجريبية ✓':'فشل: '+(r.description||r.error||'خطأ'));waLoad()});
window.waClear=A(async()=>{await api('wa-clear','POST');waLoad()});
pull();setInterval(pull,5000);
window.onhashchange=render;render();
